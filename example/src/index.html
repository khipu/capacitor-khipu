<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Harness capacitor-khipu</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="./css/harness.css" />
  </head>
  <body>
    <header>
      <h1>Harness <code>capacitor-khipu</code></h1>
      <p id="platform-note" class="note"></p>
    </header>

    <main>
      <section>
        <h2>Operation</h2>
        <label for="operationId">operationId</label>
        <input id="operationId" type="text" autocomplete="off" spellcheck="false" />
      </section>

      <section>
        <h2>Presets</h2>
        <div id="presets" class="presets"></div>
      </section>

      <section>
        <h2>Options</h2>
        <p class="hint">
          Check <strong>include</strong> to send the key. Left unchecked, the key does not go in the payload and the
          native SDK applies its default value.
        </p>
        <div id="options"></div>
      </section>

      <section>
        <h2>Colors</h2>
        <label class="row">
          <input id="colors-include" type="checkbox" />
          send the <code>colors</code> object
        </label>
        <div id="colors"></div>
      </section>

      <section>
        <h2>Payload</h2>
        <pre id="payload"></pre>
        <button id="start" type="button" class="primary">Start operation</button>
      </section>

      <section>
        <h2>Result</h2>
        <div id="result"></div>
      </section>
    </main>

    <script src="./js/example.js" type="module"></script>
  </body>
</html>
