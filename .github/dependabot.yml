# Dependabot keeps the tooling current. What a merchant compiles moves by hand: the
# native Khipu SDKs are left out on purpose. Package.swift and CapacitorKhipu.podspec
# have no entry here, and the gradle entry below ignores `com.khipu:*` in
# android/build.gradle. KhipuClientIOS lives in two files that
# scripts/check-native-versions.mjs holds in sync, a bump to one of them alone would
# fail that guard, and every SDK version is checked on devices before it ships
# (docs/STATUS.md).
#
# Version updates only bump direct dependencies. The vulnerable transitive packages
# behind most alerts are fixed by security updates, a repository setting rather than
# this file; the `security` groups below only batch those pull requests into one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    # A release that is days old is where a hijacked package does its damage.
    # Security updates are exempt, so a fix still arrives as soon as it exists.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # A Capacitor major is a new plugin line with its own branch (docs/STATUS.md),
      # not a dependency bump. `ignore` applies to security updates too.
      - dependency-name: "@capacitor/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/ios"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/cli"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler and its package ships no JavaScript API:
      # typescript-eslint (<6.1.0 as of 8.70) cannot load against it, which is what
      # failed #23. Drop this once typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # @ionic/eslint-config pins the eslint major (0.5.0 requires eslint 10), so a 0.x
      # minor there can be a major in practice. Inside `tooling` a mismatch would stall
      # every other bump, so the two move together as one pull request.
      eslint:
        patterns: ["eslint", "@ionic/eslint-config"]
      # Majors stay out of the group: each one gets its own pull request, since those
      # are the ones that need reading (release-it 17 -> 21 needed commitlint too).
      tooling:
        patterns: ["*"]
        exclude-patterns: ["eslint", "@ionic/eslint-config"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The example app is not published, but it is what device runs are built from.
  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Every @capacitor/* package the example uses tracks the Capacitor major.
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
    groups:
      example:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # What is left for Dependabot on Android: the test dependencies in android/build.gradle
  # and the Gradle wrapper of both projects. It reads build files as text, so a version
  # that comes from a variable is invisible to it: the `project.hasProperty(...) ?`
  # fallbacks, and example/android/variables.gradle. Projects that live in node_modules
  # are skipped. One entry for both directories, so a wrapper bump moves them together.
  - package-ecosystem: gradle
    directories:
      - /android
      - /example/android
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The Android SDK, see the top of this file.
      - dependency-name: "com.khipu:*"
      # AGP, Gradle and google-services come from the Android template of the Capacitor
      # major a line supports: AGP 8.13.0, Gradle 8.14 and google-services 4.4.4 on
      # Capacitor 8, AGP 8.7.2, Gradle 8.11 and google-services 4.4.2 on Capacitor 7.
      # The plugin's buildscript runs inside the merchant's build, so its AGP stays on
      # Capacitor's. Gradle takes patches only: a minor would take 7.x off its template,
      # and Capacitor 9 ships Gradle 9 and AGP 9 with the next plugin line. The example
      # never applies google-services (there is no google-services.json), so it just
      # follows the template.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.google.gms:google-services"
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # org.json versions are dates, so every one of its bumps is a major and gets its
      # own pull request.
      android:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The 7.x line (Capacitor 7). Dependabot reads this file only from the default branch,
  # so another line gets its updates through `target-branch`, not through a
  # dependabot.yml of its own. Each entry below repeats the main entry for the same
  # ecosystem and directory, and is identical to it apart from `target-branch` and the
  # `security` groups: security updates only cover the default branch, so on 7.x a
  # vulnerable transitive package moves only when a version update moves it. Branch
  # names include the target branch, so the two sets of entries do not collide.
  - package-ecosystem: npm
    target-branch: "7.x"
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Same reasons as the main entry. On this line the @capacitor majors ignore is
      # what keeps Capacitor 8, which is main's line, out of 7.x.
      - dependency-name: "@capacitor/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/ios"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      eslint:
        patterns: ["eslint", "@ionic/eslint-config"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["eslint", "@ionic/eslint-config"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    target-branch: "7.x"
    directory: /example
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
    groups:
      example:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    target-branch: "7.x"
    directories:
      - /android
      - /example/android
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "com.khipu:*"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.google.gms:google-services"
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      android:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    target-branch: "7.x"
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
