name: CI

on:
  push:
    branches: [main, 7.x]
  pull_request:
    branches: [main, 7.x]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run lint` is not used here: it chains eslint && prettier --check &&
      # swiftlint, and the third stage depends on a macOS binary this runner does not
      # have. The first two stages run here separately; swiftlint runs in the ios job.
      - run: npm run eslint
      - run: npm run prettier -- --check
      - run: npm test
      - run: npm run verify:versions
      - run: npm run verify:keys
      - run: npm run verify:readme
      - run: npm run verify:web

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # App Store Connect requires Xcode 26 or later since 2026-04-28, so 26 is the oldest
      # Xcode a merchant can ship with. The image changes its default Xcode on its own
      # schedule, so this takes the newest 26.x installed and fails if there is none.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26\.'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the SPM resolution
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
      - name: Build the package
        run: xcodebuild build -scheme CapacitorKhipu -destination generic/platform=iOS
      # By UDID, not by name: which device names exist depends on the image, and a name is
      # ambiguous once several runtimes are installed (docs/STATUS.md). This takes the first
      # iPhone of the newest iOS runtime the selected Xcode supports.
      - name: Pick a simulator
        id: simulator
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime=$(xcrun simctl list runtimes available --json | jq -r --arg sdk "$sdk" '
            [.runtimes[]
              | select(.identifier | contains("SimRuntime.iOS-"))
              | select((.version | split(".") | map(tonumber) | .[0:2]) <= ($sdk | split(".") | map(tonumber) | .[0:2]))]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          udid=$(xcrun simctl list devices available --json | jq -r --arg r "$runtime" '
            .devices[$r] // [] | map(select(.name | startswith("iPhone"))) | first | .udid // empty')
          test -n "$udid"
          echo "iOS SDK $sdk, runtime $runtime, simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test the package
        run: xcodebuild test -scheme CapacitorKhipu -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
      # Installing SwiftLint and confirming its presence are two steps on purpose:
      # `npx node-swiftlint lint` exits with code 0 and prints only a warning when the
      # binary is not on the PATH. Without the `swiftlint version` step before it, the
      # lint step would pass green without reviewing a single line of Swift.
      - name: Install SwiftLint
        run: brew list swiftlint || brew install swiftlint
      - name: Confirm SwiftLint is present
        run: swiftlint version
      - name: Lint Swift
        run: npm run swiftlint -- lint
      - name: Lint the podspec
        run: pod lib lint --allow-warnings

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # gradle-wrapper.jar is a ~43 KB binary that no diff lets you inspect. This
      # action compares its checksum against Gradle's official ones: it is the only
      # defense against a tampered wrapper.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: android-actions/setup-android@v4
        with:
          # Default is 'tools platform-tools'. The obsolete `tools` package was
          # removed from the SDK repository, so sdkmanager exits 1 trying to find
          # it and the job dies before Gradle runs. Nothing here needs it.
          packages: platform-tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # android/settings.gradle includes :capacitor-android from
      # ../node_modules/@capacitor/android/capacitor, so node_modules must exist
      # before Gradle resolves the project.
      - run: npm ci
      - run: ./gradlew clean build test
        working-directory: android

  example:
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # Same as in the ios job.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26\.'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npm ci`, not `npm install`: an example lockfile out of step with
      # example/package.json has to fail here, not be rewritten on the runner. After a
      # release the lockfile's `..` entry still carries the previous plugin version, and
      # `npm ci` does not check it: the link resolves to the plugin just built.
      - name: Install the example app
        run: npm ci
        working-directory: example
      - name: Sync and build iOS
        run: |
          npm run build
          npx cap sync ios
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO
        working-directory: example
      - name: Sync Android
        run: npx cap sync android
        working-directory: example
      - name: Build Android
        run: ./gradlew assembleDebug
        working-directory: example/android
