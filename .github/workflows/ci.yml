name: CI

on:
  push:
    branches: [main, 7.x]
  pull_request:
    branches: [main, 7.x]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No se usa `npm run lint`: encadena eslint && prettier --check && swiftlint,
      # y el tercer tramo depende de un binario de macOS que este runner no tiene.
      # Los dos primeros tramos corren acá por separado; swiftlint corre en el job ios.
      - run: npm run eslint
      - run: npm run prettier -- --check
      - run: npm test
      - run: npm run verify:versions
      - run: npm run verify:keys
      - run: npm run verify:web

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cachear la resolución de SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
      - name: Build del paquete
        run: xcodebuild build -scheme CapacitorKhipu -destination generic/platform=iOS
      - name: Tests del paquete
        run: xcodebuild test -scheme CapacitorKhipu -destination 'platform=iOS Simulator,name=iPhone 16'
      # Instalar SwiftLint y confirmar su presencia son dos steps a propósito:
      # `npx node-swiftlint lint` sale con código 0 e imprime solo un warning cuando
      # el binario no está en el PATH. Sin el `swiftlint version` previo, el step de
      # lint pasaría en verde sin revisar una sola línea de Swift.
      - name: Instalar SwiftLint
        run: brew list swiftlint || brew install swiftlint
      - name: Confirmar que SwiftLint existe
        run: swiftlint version
      - name: Lint de Swift
        run: npm run swiftlint -- lint
      - name: Lint del podspec
        run: pod lib lint --allow-warnings

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # gradle-wrapper.jar es un binario de ~43 KB que ningún diff deja inspeccionar.
      # Esta action compara su checksum contra los oficiales de Gradle: es la única
      # defensa contra un wrapper alterado.
      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v4
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # android/settings.gradle incluye :capacitor-android desde
      # ../node_modules/@capacitor/android/capacitor, así que node_modules debe
      # existir antes de que Gradle resuelva el proyecto.
      - run: npm ci
      - run: ./gradlew clean build test
        working-directory: android

  example:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalar la app de ejemplo
        run: npm install
        working-directory: example
      - name: Sincronizar y construir iOS
        run: |
          npm run build
          npx cap sync ios
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO
        working-directory: example
